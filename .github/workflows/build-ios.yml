name: Build iOS

on:
  workflow_dispatch:
  push:
    paths:
      - "cmd/**"
      - "internal/**"
      - "ios/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/build-ios.yml"

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: Build gomobile framework
        run: bash ios/Scripts/build_gomobile_ios.sh

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: ios
        run: xcodegen generate

      - name: Build app unsigned
        working-directory: ios
        run: |
          xcodebuild \
            -project MasterDnsVPNiOS.xcodeproj \
            -scheme MasterDnsVPN \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ../build/ios \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          rm -rf Payload MasterDnsVPN-unsigned.ipa
          mkdir -p Payload
          cp -R build/ios/Build/Products/Release-iphoneos/MasterDnsVPN.app Payload/
          zip -qry MasterDnsVPN-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MasterDnsVPN-iOS-unsigned
          path: MasterDnsVPN-unsigned.ipa
